name: Report a bug
description: Tell us what happened in the Moyu public beta.
body:
  - type: markdown
    attributes:
      value: "Please review screenshots before uploading. Keep private desktop content and save files out of public reports."
  - type: input
    id: app_version
    attributes:
      label: Moyu version
      placeholder: 0.78.1 (build 110)
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and macOS version
      placeholder: MacBook Air M2, macOS 26
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: What did you do, what did you expect, and what happened?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or other details
